  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#faf8f4" stroke-width="1.6" opacity="0.9"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="7" fill="none" stroke="#faf8f4" stroke-width="0.8" opacity="0.45"/>
  <text x="32" y="41.5" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" letter-spacing="0.5" text-anchor="middle" fill="#faf8f4">SF</text>
  <path d="M16 49.5 H48" stroke="#faf8f4" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
